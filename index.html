    <script>
        // 修复的链接跳转函数 - 使用标准方法
        function openLink(url) {
            // 方法1：使用window.open在新标签页打开（最安全）
            const newWindow = window.open(url, '_blank');
            
            // 如果浏览器阻止了新窗口，尝试方法2
            if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
                // 方法2：在当前页面跳转
                try {
                    window.location.href = url;
                } catch (e) {
                    // 方法3：创建并点击一个隐藏的链接
                    const link = document.createElement('a');
                    link.href = url;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }
        }
        
        // 性能优化的烟花效果
        class OptimizedFireworks {
            constructor() {
                this.canvas = document.getElementById('fireworks-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.fireworks = [];
                this.timerTotal = 10;
                this.timerTick = 0;
                this.running = true;
                this.autoFireworks = true;
                this.lastTime = 0;
                this.fps = 60;
                this.fpsInterval = 1000 / this.fps;
                
                this.init();
                this.loop();
                
                // 窗口大小改变时重置画布
                window.addEventListener('resize', () => this.resizeCanvas());
            }
            
            init() {
                this.resizeCanvas();
                // 初始创建较少的烟花
                for (let i = 0; i < 2; i++) {
                    setTimeout(() => {
                        this.createFirework(this.canvas.width / 2, this.canvas.height);
                    }, i * 800);
                }
            }
            
            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            createFirework(sx, sy) {
                const x = sx || Math.random() * this.canvas.width;
                const y = sy || this.canvas.height;
                
                this.fireworks.push({
                    x: x,
                    y: y,
                    sx: x,
                    sy: y,
                    tx: Math.random() * this.canvas.width,
                    ty: Math.random() * this.canvas.height * 0.5,
                    speed: 1.5 + Math.random() * 1.5,
                    size: 2,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    brightness: 1
                });
            }
            
            explode(x, y) {
                const particleCount = 30 + Math.floor(Math.random() * 20);
                const color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 2 + 0.5;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    const size = 1 + Math.random() * 1.5;
                    const decay = 0.03 + Math.random() * 0.04;
                    
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: vx,
                        vy: vy,
                        size: size,
                        color: color,
                        brightness: 1,
                        decay: decay,
                        gravity: 0.02
                    });
                }
            }
            
            update() {
                if (!this.running) return;
                
                // 自动生成新的烟花
                if (this.autoFireworks) {
                    this.timerTick++;
                    if (this.timerTick >= this.timerTotal) {
                        // 限制同时存在的烟花数量
                        if (this.fireworks.length < 2) {
                            this.createFirework();
                        }
                        this.timerTick = 0;
                        this.timerTotal = 12 + Math.random() * 20;
                    }
                }
                
                // 更新烟花位置
                for (let i = this.fireworks.length - 1; i >= 0; i--) {
                    const fw = this.fireworks[i];
                    
                    // 计算距离目标位置的距离
                    const dx = fw.tx - fw.x;
                    const dy = fw.ty - fw.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // 如果接近目标位置，就爆炸
                    if (distance < 10) {
                        this.explode(fw.x, fw.y);
                        this.fireworks.splice(i, 1);
                        continue;
                    }
                    
                    // 移动烟花
                    fw.x += (dx / distance) * fw.speed;
                    fw.y += (dy / distance) * fw.speed;
                }
                
                // 更新粒子位置
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    
                    // 更新位置
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    
                    // 衰减
                    p.brightness -= p.decay;
                    
                    // 移除不可见的粒子
                    if (p.brightness <= 0 || p.y > this.canvas.height) {
                        this.particles.splice(i, 1);
                    }
                }
                
                // 限制粒子总数
                if (this.particles.length > 150) {
                    this.particles.splice(0, this.particles.length - 100);
                }
            }
            
            draw() {
                // 创建半透明黑色背景，用于拖尾效果
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制烟花
                for (const fw of this.fireworks) {
                    this.ctx.beginPath();
                    this.ctx.arc(fw.x, fw.y, fw.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = fw.color;
                    this.ctx.fill();
                }
                
                // 绘制粒子
                for (const p of this.particles) {
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    
                    // 根据亮度调整颜色
                    const color = p.color.replace('hsl', 'hsla').replace(')', `, ${p.brightness})`);
                    this.ctx.fillStyle = color;
                    this.ctx.fill();
                }
            }
            
            loop(timestamp) {
                if (!this.lastTime) this.lastTime = timestamp;
                
                const elapsed = timestamp - this.lastTime;
                
                if (elapsed > this.fpsInterval) {
                    this.lastTime = timestamp - (elapsed % this.fpsInterval);
                    
                    this.update();
                    this.draw();
                }
                
                requestAnimationFrame((ts) => this.loop(ts));
            }
            
            trigger() {
                // 触发少量烟花
                for (let i = 0; i < 2; i++) {
                    setTimeout(() => {
                        this.createFirework(
                            Math.random() * this.canvas.width,
                            this.canvas.height
                        );
                    }, i * 300);
                }
            }
        }

        const changeInterval = 10 * 60 * 1000; // 10分钟

        // 初始化自动更换颜色

            autoChangeInterval = setInterval(changeAllColors, changeInterval);

        // 生成随机颜色函数
        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            const saturation = 60 + Math.floor(Math.random() * 30);
            const lightness = 40 + Math.floor(Math.random() * 30);
            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }
        
        // 生成随机渐变色函数
        function getRandomGradient(angle = 90) {
            const hue1 = Math.floor(Math.random() * 360);
            const hue2 = (hue1 + 60) % 360;
            const saturation = 60 + Math.floor(Math.random() * 30);
            const lightness = 40 + Math.floor(Math.random() * 30);
            return `linear-gradient(${angle}deg, hsla(${hue1}, ${saturation}%, ${lightness}%, 0.9), hsla(${hue2}, ${saturation}%, ${lightness - 10}%, 0.9))`;
        }
        
        // 更换所有颜色函数
        function changeAllColors() {
            // 1. 更换页面背景色
            const pageHue = Math.floor(Math.random() * 360);
            const pageSaturation = 60 + Math.floor(Math.random() * 30);
            const pageLightness = 40 + Math.floor(Math.random() * 30);
            const pageColor1 = `hsl(${pageHue}, ${pageSaturation}%, ${pageLightness}%)`;
            const pageColor2 = `hsl(${(pageHue + 60) % 360}, ${pageSaturation}%, ${pageLightness - 10}%)`;
            document.body.style.background = `linear-gradient(135deg, ${pageColor1} 0%, ${pageColor2} 100%)`;
            
            // 2. 更换标题区域颜色
            const titleElement = document.querySelector('.title');
            if (titleElement) {
                titleElement.style.background = getRandomGradient(90);
            }
            
            // 3. 更换推广链接区域颜色
            const promoItems = document.querySelectorAll('.promo-item');
            promoItems.forEach(item => {
                const gradient = getRandomGradient(90);
                item.style.background = gradient;
                
                // 更新CSS变量
                const hue1 = Math.floor(Math.random() * 360);
                const hue2 = (hue1 + 60) % 360;
                item.style.setProperty('--icon-color1', `hsl(${hue1}, 70%, 60%)`);
                item.style.setProperty('--icon-color2', `hsl(${hue2}, 70%, 50%)`);
            });
            
            // 4. 更换推广链接图标颜色
            const promoIcons = document.querySelectorAll('.promo-icon');
            promoIcons.forEach(icon => {
                const hue1 = Math.floor(Math.random() * 360);
                const hue2 = (hue1 + 60) % 360;
                icon.style.setProperty('--icon-color1', `hsl(${hue1}, 70%, 60%)`);
                icon.style.setProperty('--icon-color2', `hsl(${hue2}, 70%, 50%)`);
            });
            
            // 5. 更换推广链接标题颜色
            const promoTitles = document.querySelectorAll('.promo-title');
            promoTitles.forEach(title => {
                title.style.color = getRandomColor();
            });
            
            // 6. 更换推广链接描述颜色
            const promoDescs = document.querySelectorAll('.promo-desc');
            promoDescs.forEach(desc => {
                desc.style.color = getRandomColor();
            });
            
            // 7. 更换箭头颜色
            const promoArrows = document.querySelectorAll('.promo-arrow');
            promoArrows.forEach(arrow => {
                arrow.style.color = getRandomColor();
            });
            
            // 8. 更换点击提示颜色
            const clickHints = document.querySelectorAll('.click-hint');
            clickHints.forEach(hint => {
                hint.style.color = getRandomColor();
            });
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 根据设备性能调整效果
            const isMobile = window.innerWidth <= 768;
            const isLowPerformance = navigator.hardwareConcurrency <= 2;
            
            // 初始化烟花效果（在低性能设备或移动设备上减少效果）
            if (!isMobile && !isLowPerformance) {
                fireworksInstance = new OptimizedFireworks();
                
                // 每90秒自动触发一次烟花
                setInterval(() => {
                    if (fireworksInstance && fireworksInstance.autoFireworks) {
                        fireworksInstance.trigger();
                    }
                }, 90000);
            }
            
            // 初始化自动颜色更换
            initAutoColorChange();
            
            // 为所有推广链接容器添加点击事件
            const promoItems = document.querySelectorAll('.promo-item');
            promoItems.forEach(item => {
                // 添加触摸设备支持
                item.addEventListener('touchstart', function() {
                    this.style.transform = 'translateY(-5px) scale(0.98)';
                });
                
                item.addEventListener('touchend', function() {
                    this.style.transform = '';
                });
                
                // 添加键盘支持
                item.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        const url = this.getAttribute('data-url');
                        if (url) openLink(url);
                    }
                });
                
                // 添加点击效果
                item.addEventListener('click', function() {
                    // 添加点击动画效果
                    this.style.boxShadow = '0 0 30px rgba(255, 255, 255, 0.6)';
                    setTimeout(() => {
                        this.style.boxShadow = '';
                    }, 300);
                    
                    // 点击链接时触发小型烟花效果（仅在烟花效果启用时）
                    if (fireworksInstance) {
                        const rect = this.getBoundingClientRect();
                        const x = rect.left + rect.width / 2;
                        const y = rect.top + rect.height / 2;
                        fireworksInstance.createFirework(x, y);
                    }
                });
            });
            
            // 为可点击元素添加键盘焦点支持
            promoItems.forEach(item => {
                item.setAttribute('tabindex', '0');
            });
        });
    </script>
</body>
</html>
