        .container {

        }
        h1.main-title span { 
            background: linear-gradient(90deg, #60a5fa, #c4b5fd); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .cards { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 50px; 
            margin: 0 auto;
        }
        .card { 
            width: 360px; 
            height: 110px; 
            background: rgba(255, 255, 255, 0.07); 
            backdrop-filter: blur(10px); 
            border-radius: 55px / 110px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 20px 25px; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            text-align: left; 
            position: relative; 
            overflow: hidden; 
            transition: all 0.5s ease; 
            text-decoration: none;
        }
        .card::before { 
            content: ''; 
            position: absolute; 
            top: -100%; 
            left: -100%; 
            width: 200%; 
            height: 200%; 
            background: conic-gradient(transparent, #60a5fa, transparent 30%); 
            animation: rotate 8s linear infinite; 
            z-index: -1; 
            border-radius: inherit; 
        }
        .card::after { 
            content: ''; 
            position: absolute; 
            inset: 2px; 
            background: #0f172a; 
            border-radius: inherit; 
            z-index: -1; 
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .card:hover { 
            transform: translateY(-5px) scale(1.05); 
            border-color: rgba(96, 165, 250, 0.4); 
        }
        .icon { 
            font-size: 1.8rem; 
            margin-right: 18px; 
            opacity: 0.9; 
            min-width: 50px; 
            text-align: center; 
        }
        .text-content { 
            flex: 1; 
            overflow: hidden;
        }
        h3 { 
            color: #f1f5f9; 
            margin-bottom: 5px; 
            font-weight: 600; 
            font-size: 1.1rem; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        p { 
            color: #cbd5e1; 
            line-height: 1.4; 
            font-size: 0.8rem; 
            margin-bottom: 8px; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .btn { 
            background: linear-gradient(90deg, #3b82f6, #8b5cf6); 
            color: white; 
            border: none; 
            padding: 5px 15px; 
            border-radius: 50px; 
            font-weight: 600; 
            font-size: 0.8rem; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); 
        }
        .card:hover .btn { 
            transform: scale(1.05); 
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.5); 
        }
        .bg-blob { 
            position: absolute; 
            width: 400px; 
            height: 400px; 
            background: linear-gradient(90deg, #1e40af, #3730a3); 
            border-radius: 50%; 
            filter: blur(60px); 
            opacity: 0.15; 
            z-index: 1; 
            animation: float 20s ease-in-out infinite; 
        }
        .blob1 { top: 10%; left: 10%; animation-delay: 0s; }
        .blob2 { bottom: 10%; right: 10%; background: linear-gradient(90deg, #7c3aed, #db2777); animation-delay: -10s; }
        @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-30px, -40px) scale(1.05); } }
        
        @media (max-width: 2200px) { .container { max-width: 1800px; } }
        @media (max-width: 1800px) { .cards { gap: 40px; } }
        @media (max-width: 1600px) { .container { max-width: 1400px; } .cards { gap: 35px; } }
        @media (max-width: 1400px) { .cards { gap: 30px; } }
        @media (max-width: 1200px) { .cards { gap: 25px; } }
        @media (max-width: 992px) { .cards { gap: 20px; } }
        @media (max-width: 768px) {
            h1.main-title { font-size: 2.5rem; margin-bottom: 3rem; }
            .cards { gap: 15px; }
            .card { width: 100%; max-width: 360px; height: 105px; padding: 15px 20px; }
            .icon { font-size: 1.6rem; margin-right: 15px; min-width: 45px; }
        }
        @media (max-width: 576px) { .cards { gap: 12px; } body { padding: 20px 15px; } h1.main-title { font-size: 2.2rem; } }
    </style>
